# For local development: start the app + database on your computer in one go.
#   docker compose up --build      → http://localhost:8000
#   docker compose up -d db        → start only the database (when running uvicorn directly or pytest)
#   docker compose down            → stop (messages are kept)
#   docker compose down -v         → stop and also delete the database volume (all messages are gone)

# Pin the project name. Without it, Docker uses the folder name, so cloning into a folder called
# wejump-deployment (or renaming the folder) would start a new, empty database volume (wejump_pgdata).
name: wejump

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wejump
      POSTGRES_PASSWORD: localdev # For your computer only. Never write a password in a file like this on a real server.
      POSTGRES_DB: wejump_deployment
    ports:
      - "5432:5432" # So uvicorn/pytest on your computer can connect
    volumes:
      - pgdata:/var/lib/postgresql/data # Database files are stored in a "volume" outside the container → they survive when the container is deleted
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wejump -d wejump_deployment"]
      interval: 2s
      retries: 15

  app:
    build: .
    # For development only: --reload restarts the server when a Python file changes
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app
    environment:
      DATABASE_URL: postgresql://wejump:localdev@db:5432/wejump_deployment # Containers find each other by service name (db)
      APP_COLOR: local
      SESSION_SECRET: local-dev-only-secret # For your computer only. Real servers get a long random value
      # GitHub login: make an OAuth App for localhost (docs/08-login.md) and put its values in .env.
      # Without them the app still runs; only "Sign in with GitHub" says it isn't configured.
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    ports:
      - "8000:8000"
    volumes:
      # For development only: connect your app/ folder into the container (a "bind mount").
      # Edits show up right away: refresh the browser for HTML/CSS/JS; Python changes restart the server.
      # Changes to requirements.txt or the Dockerfile still need: docker compose up --build
      # A real server has no bind mount. It runs only the copy baked into the image, so it needs a new build.
      - ./app:/srv/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
