# Pushing to the main branch automatically runs:  test → image build → zero-downtime deploy to the server
#
#   test   : start a database briefly and run pytest. Stops here on failure (broken code never gets deployed)
#   build  : build the image from the Dockerfile and push it to GitHub's registry (ghcr.io)
#   deploy : ssh into the server and run deploy.sh (exactly the commands a person would type by hand)
#
# Required settings (repo → Settings → Secrets and variables → Actions):
#   Variables  VPS_HOST     server address (not secret)
#              VPS_USER     login user, default deploy (not secret)
#   Secrets    VPS_SSH_KEY  private key for logging into the server (secret!)
# If VPS_HOST is empty, the deploy step is skipped.

name: deploy-vps

on:
  push:
    branches: [main]
  workflow_dispatch: # Run manually with the "Run workflow" button in the Actions tab

permissions:
  contents: read
  packages: write # Permission to push images to ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres: # A database that lives only during the tests
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wejump
          POSTGRES_PASSWORD: test
          POSTGRES_DB: wejump
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wejump"
          --health-interval 2s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://wejump:test@localhost:5432/wejump
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -v

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v5

      - name: Pick the image name and tag
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/wejump" >> "$GITHUB_OUTPUT"  # ,, = lowercase
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"                               # first 7 characters of the commit

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # A temporary token GitHub creates automatically for every run

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64 # The server's (e2-micro) CPU type
          build-args: APP_VERSION=${{ steps.meta.outputs.tag }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: ${{ vars.VPS_HOST != '' }}
    runs-on: ubuntu-latest
    concurrency: deploy-vps # Queue deploys so two never run at the same time
    steps:
      - name: Prepare the SSH key
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ vars.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Run deploy.sh on the server
        run: |
          ssh "${{ vars.VPS_USER || 'deploy' }}@${{ vars.VPS_HOST }}" \
            "cd /opt/wejump && git pull --ff-only && ./deploy/vps/deploy.sh ${{ needs.build.outputs.tag }}"
