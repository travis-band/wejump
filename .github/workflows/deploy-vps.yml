# main 브랜치에 push하면 자동으로:  테스트 → 이미지 빌드 → 서버에 무중단 배포
#
#   test   : DB를 잠깐 띄워서 pytest. 실패하면 여기서 멈춤 (고장난 코드는 배포되지 않음)
#   build  : Dockerfile로 이미지를 만들어 GitHub 레지스트리(ghcr.io)에 올림
#   deploy : 서버에 ssh로 접속해서 deploy.sh 실행 (사람이 손으로 하던 것과 똑같은 명령)
#
# 필요한 설정 (레포 → Settings → Secrets and variables → Actions):
#   Variables  VPS_HOST     서버 주소 (비밀 아님)
#              VPS_USER     접속 사용자, 기본 deploy (비밀 아님)
#   Secrets    VPS_SSH_KEY  서버 접속용 개인키 (비밀!)
# VPS_HOST가 비어 있으면 deploy 단계는 건너뜁니다.

name: deploy-vps

on:
  push:
    branches: [main]
  workflow_dispatch: # Actions 탭에서 "Run workflow" 버튼으로 수동 실행

permissions:
  contents: read
  packages: write # ghcr.io에 이미지를 올릴 권한

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres: # 테스트 동안만 잠깐 사는 DB
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wejump
          POSTGRES_PASSWORD: test
          POSTGRES_DB: wejump
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wejump"
          --health-interval 2s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://wejump:test@localhost:5432/wejump
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -v

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v5

      - name: 이미지 이름과 태그 정하기
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/wejump" >> "$GITHUB_OUTPUT"  # ,, = 소문자로
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"                               # 커밋 번호 앞 7자리

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # GitHub가 매 실행마다 자동으로 만들어 주는 임시 토큰

      - uses: docker/setup-buildx-action@v3

      - name: 빌드 & 푸시
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64 # 서버(e2-micro) CPU 종류
          build-args: APP_VERSION=${{ steps.meta.outputs.tag }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: ${{ vars.VPS_HOST != '' }}
    runs-on: ubuntu-latest
    concurrency: deploy-vps # 배포 두 개가 동시에 돌지 않게 줄 세우기
    steps:
      - name: SSH 키 준비
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ vars.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: 서버에서 deploy.sh 실행
        run: |
          ssh "${{ vars.VPS_USER || 'deploy' }}@${{ vars.VPS_HOST }}" \
            "cd /opt/wejump && git pull --ff-only && ./deploy/vps/deploy.sh ${{ needs.build.outputs.tag }}"
