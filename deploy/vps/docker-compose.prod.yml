# The setup that runs on the VPS (the real server). Four containers live inside one server.
#
#   internet ──443──▶ caddy ──▶ app-blue  ─┐
#                            (only one)    ├──▶ db ──▶ pgdata volume (disk)
#                           ╰─▶ app-green ─┘
#
# Don't run `docker compose up` yourself; deploy with ./deploy.sh <tag>.
# Values (${...}) are read from the .env file in the same folder. .env exists only on the server, never in git.

name: wejump-prod # A different name so volumes don't mix with local development (docker-compose.yml)

x-app: &app # Settings shared by blue and green
  restart: unless-stopped
  environment: &app-env
    DATABASE_URL: postgresql://wejump:${POSTGRES_PASSWORD}@db:5432/wejump_deployment
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: wejump
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: wejump_deployment
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wejump -d wejump_deployment"]
      interval: 3s
      retries: 20
    # No ports here → the database can't be reached from the internet, only by containers on the same server

  app-blue:
    <<: *app
    image: ${IMAGE:?set IMAGE in .env}:${BLUE_TAG:-latest}
    environment:
      <<: *app-env
      APP_COLOR: blue

  app-green:
    <<: *app
    image: ${IMAGE}:${GREEN_TAG:-latest}
    environment:
      <<: *app-env
      APP_COLOR: green

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      # deploy.sh generates the Caddyfile from Caddyfile.template (it says which color to point at)
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # Stores HTTPS certificates. Delete it and they have to be issued again
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
