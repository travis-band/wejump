# Render Blueprint: an order form that says "please deploy this repo like this".
# In the Render dashboard → New → Blueprint → pick this repo, and Render reads this file and builds everything.
#
# It uses the same Dockerfile as the VPS track. The only difference is that Render, not us,
# manages the server, proxy, HTTPS, and blue/green.

services:
  - type: web
    name: wejump
    runtime: docker # Build the image from the repo's Dockerfile
    plan: free # Sleeps after 15 minutes with no requests. Takes about a minute to wake up on the next request
    region: singapore # The Render region closest to Korea. Put the Neon database in Singapore too
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz # Traffic moves only after the new version returns 200 here (Render's zero-downtime deploy)
    autoDeployTrigger: checksPass # Deploy only commits that passed the GitHub Actions tests
    envVars:
      - key: DATABASE_URL
        sync: false # The value isn't written in this file; enter it in the dashboard (the Neon connection string)
      - key: APP_COLOR
        value: render
