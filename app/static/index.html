<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>wejump guestbook</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="deploy-bar" aria-hidden="true"></div>

  <main>
    <nav class="account" id="account"></nav>

    <header class="top">
      <h1>wejump guestbook</h1>
      <div class="refresh">
        <label class="switch">
          <input type="checkbox" id="auto-refresh" role="switch">
          Auto-refresh every 10 s
        </label>
        <span id="refresh-status">Last updated …</span>
      </div>
    </header>
    <p class="lead">Welcome! Leave a message.</p>

    <p id="signin-hint" class="signin-hint">
      <a href="/auth/login">Sign in with GitHub</a> to leave a message. Anyone can read without signing in.
    </p>

    <form id="form" hidden>
      <textarea id="body" name="body" placeholder="Your message (up to 200 characters)" maxlength="200" rows="2" required></textarea>
      <button type="submit">Post</button>
      <p id="error" class="error" role="alert"></p>
    </form>

    <ul id="messages"></ul>
  </main>

  <footer>
    Answered by: <span id="color-badge" class="badge">…</span>
    version <code id="version">…</code>
  </footer>

  <script src="/common.js"></script>
  <script src="/app.js"></script>
</body>
</html>
