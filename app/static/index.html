<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>wejump guestbook</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="deploy-bar" aria-hidden="true"></div>

  <main>
    <h1>wejump guestbook</h1>
    <p class="lead">Leave a message. It stays in the database even when the server restarts.</p>

    <form id="form">
      <input id="name" name="name" placeholder="Name" maxlength="30" required autocomplete="off">
      <textarea id="body" name="body" placeholder="Your message (up to 200 characters)" maxlength="200" rows="2" required></textarea>
      <button type="submit">Post</button>
      <p id="error" class="error" role="alert"></p>
    </form>

    <ul id="messages"></ul>
  </main>

  <footer>
    Answered by: <span id="color-badge" class="badge">…</span>
    version <code id="version">…</code>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
